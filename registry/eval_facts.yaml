# Layer 2 (calculation accuracy) — deterministic known-answer checks.
# eval.py asks each and verifies the number appears in the answer (number matching,
# NOT LLM-as-judge — per CLAUDE.md Section 11). Seed values for YOUR data.
#
# These are TPCH benchmark invariants — exact for SNOWFLAKE_SAMPLE_DATA.TPCH_SF1000.
# All are cheap COUNT(*) lookups (Snowflake answers from metadata).

facts:
