    tolerance: 0
  - question: "How many rows are in the ORDERS table? Use SELECT COUNT(*)."
    expect: 1500000000
    tolerance: 0
  - question: "How many rows are in the CUSTOMER table? Use SELECT COUNT(*)."
    expect: 150000000
    tolerance: 0
  - question: "How many rows are in the SUPPLIER table? Use SELECT COUNT(*)."
    expect: 10000000
